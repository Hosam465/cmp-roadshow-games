<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#070708">
    <title>Compliance Roadshow Games</title>
    <link rel="icon" type="image/webp" href="assets/logo.webp">
    <link rel="apple-touch-icon" href="assets/logo.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg" aria-hidden="true"></div>

    <header class="topbar">
        <button class="brand" id="brand" type="button" aria-label="Home">
            <img src="assets/logo.webp" alt="SAB" class="brand-logo">
        </button>
        <div class="topbar-actions">
            <div class="player-chip" id="playerChip" hidden>
                <span class="avatar" id="playerInitial"></span>
                <span class="player-meta"><b id="playerName"></b><small id="playerPoints"></small></span>
            </div>
            <button class="chip-btn solid" id="finishBtn" type="button" hidden>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-1.5 4L16 12H5"/></svg>
                <span data-t="finish"></span>
            </button>
            <button class="chip-btn" id="langBtn" type="button" hidden>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
                <span id="langLabel">العربية</span>
            </button>
        </div>
    </header>

    <main id="app" class="app"></main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="offline" id="offline" hidden><span></span><b id="offlineText">Reconnecting…</b></div>

    <script src="app.js"></script>
</body>
</html>
