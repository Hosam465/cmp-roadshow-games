<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard · Compliance Roadshow</title>
    <link rel="icon" type="image/webp" href="assets/logo.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #E31B23; --red-hi: #FF3B42; --red-deep: #9E0F15;
            --white: #fff; --text-2: rgba(255,255,255,.72); --text-3: rgba(255,255,255,.46);
            --hair: rgba(255,255,255,.10); --hair-2: rgba(255,255,255,.2);
            --glass: linear-gradient(180deg, rgba(22,22,24,.80) 0%, rgba(8,8,9,.88) 100%);
            --ok: #17A864;
            --display: 'Readex Pro', 'IBM Plex Sans Arabic', system-ui, sans-serif;
            --body: 'Manrope', 'IBM Plex Sans Arabic', system-ui, sans-serif;
            --ease: cubic-bezier(.2,.8,.2,1);
            --u: min(1vw, 1.78vh); /* scales with the TV */
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: var(--body); color: var(--white); background: #070708;
            overflow: hidden; -webkit-font-smoothing: antialiased;
        }
        .bg { position: fixed; inset: 0; z-index: -1; background: url('assets/background.webp') center / cover no-repeat; }
        .bg::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at 50% 45%, rgba(4,4,5,.6) 0%, rgba(4,4,5,.4) 100%), rgba(4,4,5,.5); }

        .stage {
            height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: calc(var(--u) * 2);
            padding: calc(var(--u) * 2.4) calc(var(--u) * 3);
        }

        .panel {
            position: relative;
            background: var(--glass);
            border-radius: calc(var(--u) * 1.6);
            backdrop-filter: blur(18px) saturate(120%);
            -webkit-backdrop-filter: blur(18px) saturate(120%);
            box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 30px 80px -30px rgba(0,0,0,.9);
        }
        .panel::before {
            content: ''; position: absolute; inset: 0; padding: 1px; border-radius: inherit; pointer-events: none;
            background: linear-gradient(160deg, rgba(255,255,255,.28), rgba(255,255,255,.05) 40%, rgba(227,27,35,.35));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
        }

        header {
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
            padding: calc(var(--u) * 1.4) calc(var(--u) * 2.4);
        }
        header img { height: calc(var(--u) * 5); width: auto; display: block; }
        .title { text-align: center; }
        .title h1 { font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 3.4); letter-spacing: -.03em; line-height: 1; }
        .title h1 em { font-style: normal; color: var(--red-hi); }
        .title p { font-family: var(--body); color: var(--text-2); font-size: calc(var(--u) * 1.5); margin-top: calc(var(--u) * .5); }
        .station { justify-self: end; display: flex; align-items: center; gap: calc(var(--u) * 1); }
        .pill {
            display: inline-flex; align-items: center; gap: calc(var(--u) * .7);
            padding: calc(var(--u) * .7) calc(var(--u) * 1.4);
            border-radius: 999px; border: 1px solid var(--hair-2);
            font-weight: 700; font-size: calc(var(--u) * 1.2);
        }
        .dot { width: calc(var(--u) * .8); height: calc(var(--u) * .8); border-radius: 50%; background: var(--ok); animation: pulse 1.8s infinite; }
        .dot.off { background: var(--red); animation: none; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(23,168,100,.7); } 70% { box-shadow: 0 0 0 calc(var(--u) * 1) rgba(23,168,100,0); } 100% { box-shadow: 0 0 0 0 rgba(23,168,100,0); } }

        main { display: grid; grid-template-columns: 1.55fr 1fr; gap: calc(var(--u) * 2); min-height: 0; }

        .board { padding: calc(var(--u) * 2.2); display: flex; flex-direction: column; min-height: 0; }
        .section-label {
            display: flex; justify-content: space-between; align-items: baseline;
            font-family: var(--display); font-size: calc(var(--u) * 1.1); font-weight: 500;
            letter-spacing: .28em; text-transform: uppercase; color: var(--text-2);
            margin-bottom: calc(var(--u) * 1.6);
        }
        .section-label span:last-child { letter-spacing: 0; font-family: 'IBM Plex Sans Arabic', sans-serif; text-transform: none; font-size: calc(var(--u) * 1.3); }

        #board { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: calc(var(--u) * 1.4); margin-bottom: calc(var(--u) * 1.8); }
        .pod {
            text-align: center; border-radius: calc(var(--u) * 1.3);
            padding: calc(var(--u) * 1.8) calc(var(--u) * 1.2) calc(var(--u) * 1.6);
            background: rgba(255,255,255,.04); border: 1px solid var(--hair);
            position: relative; overflow: hidden;
        }
        .pod.p1 {
            padding-top: calc(var(--u) * 2.8);
            background: linear-gradient(180deg, rgba(227,27,35,.35), rgba(227,27,35,.08));
            border-color: rgba(255,59,66,.6);
            box-shadow: 0 20px 60px -20px rgba(227,27,35,.7);
        }
        .medal {
            width: calc(var(--u) * 4.2); height: calc(var(--u) * 4.2); margin: 0 auto calc(var(--u) * 1);
            border-radius: 50%; display: grid; place-items: center;
            font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 1.9);
            background: rgba(255,255,255,.1); border: 1px solid var(--hair-2);
        }
        .p1 .medal { width: calc(var(--u) * 5.2); height: calc(var(--u) * 5.2); font-size: calc(var(--u) * 2.4); background: var(--white); color: #111; border: 0; }
        .pod .nm { font-weight: 800; font-size: calc(var(--u) * 1.6); line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
        .p1 .nm { font-size: calc(var(--u) * 2); }
        .pod .id { color: var(--text-3); font-size: calc(var(--u) * 1); font-weight: 600; margin-top: calc(var(--u) * .2); }
        .pod .pts { font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 2.6); margin-top: calc(var(--u) * .8); line-height: 1; }
        .p1 .pts { font-size: calc(var(--u) * 3.4); }
        .pod .pts small { font-size: .4em; color: var(--text-2); font-weight: 500; margin-inline-start: .3em; }
        .pod.empty { opacity: .35; }

        .rows { display: grid; gap: calc(var(--u) * .7); overflow: hidden; align-content: start; }
        .row {
            display: grid; grid-template-columns: calc(var(--u) * 3.4) 1fr auto auto; align-items: center; gap: calc(var(--u) * 1.4);
            padding: calc(var(--u) * .9) calc(var(--u) * 1.4);
            border-radius: calc(var(--u) * 1); background: rgba(255,255,255,.035); border: 1px solid var(--hair);
        }
        .row .rk { font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 1.5); color: var(--text-2); text-align: center; }
        .row .nm { font-weight: 700; font-size: calc(var(--u) * 1.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row .nm small { color: var(--text-3); font-weight: 600; font-size: .72em; margin-inline-start: calc(var(--u) * .8); }
        .row .gm { color: var(--text-3); font-size: calc(var(--u) * 1.05); font-weight: 600; }
        .row .pts { font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 1.8); min-width: calc(var(--u) * 6); text-align: end; }
        .flash { animation: flash 1.8s var(--ease); }
        @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(255,59,66,.9); background: rgba(227,27,35,.5); } 100% { box-shadow: 0 0 0 calc(var(--u) * 1.2) rgba(255,59,66,0); } }

        .empty-board { flex: 1; display: grid; place-items: center; text-align: center; color: var(--text-2); font-size: calc(var(--u) * 1.6); }
        .empty-board b { display: block; font-family: var(--display); font-weight: 600; color: var(--white); font-size: calc(var(--u) * 2.6); margin-bottom: calc(var(--u) * .6); }
        .empty-board span { font-family: 'IBM Plex Sans Arabic', sans-serif; }

        .side { display: grid; grid-template-rows: auto 1fr 1fr; gap: calc(var(--u) * 1.4); min-height: 0; }
        .side .section-label { margin: calc(var(--u) * .6) calc(var(--u) * .4) 0; }
        .ipad { padding: calc(var(--u) * 2); display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        .ipad-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: calc(var(--u) * 1.4); }
        .ipad-tag { font-family: var(--display); font-weight: 500; font-size: calc(var(--u) * 1.05); letter-spacing: .22em; text-transform: uppercase; color: var(--text-2); }
        .live { display: inline-flex; align-items: center; gap: calc(var(--u) * .6); font-weight: 800; font-size: calc(var(--u) * .95); letter-spacing: .12em; color: var(--red-hi); }
        .live::before { content: ''; width: calc(var(--u) * .7); height: calc(var(--u) * .7); border-radius: 50%; background: var(--red-hi); animation: blink 1.2s infinite; }
        @keyframes blink { 50% { opacity: .2; } }
        .who { display: flex; align-items: center; gap: calc(var(--u) * 1.2); margin-bottom: calc(var(--u) * 1.4); min-width: 0; }
        .avatar {
            width: calc(var(--u) * 5); height: calc(var(--u) * 5); border-radius: 50%; flex: none;
            display: grid; place-items: center; background: var(--white); color: #111;
            font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 2.2);
        }
        .who > div { min-width: 0; }
        .who .nm { font-weight: 800; font-size: calc(var(--u) * 2.1); line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .who .sub { color: var(--text-2); font-size: calc(var(--u) * 1.2); font-weight: 600; margin-top: calc(var(--u) * .2); }
        .bar { height: calc(var(--u) * .6); border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
        .bar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--red-deep), var(--red-hi)); box-shadow: 0 0 12px rgba(255,59,66,.7); transition: width .6s var(--ease); }
        .stats { display: flex; justify-content: space-between; margin-top: calc(var(--u) * .9); color: var(--text-2); font-weight: 700; font-size: calc(var(--u) * 1.15); }
        .stats b { color: var(--white); font-family: var(--display); font-weight: 600; }
        .idle { text-align: center; color: var(--text-2); }
        .idle .icon {
            width: calc(var(--u) * 5.5); height: calc(var(--u) * 5.5); margin: 0 auto calc(var(--u) * 1.2);
            border-radius: calc(var(--u) * 1.4); display: grid; place-items: center;
            background: linear-gradient(145deg, #F2343B, #C3121A); color: #fff;
            box-shadow: 0 18px 40px -12px rgba(227,27,35,.8);
            animation: bob 2.4s ease-in-out infinite;
        }
        .idle .icon svg { width: 50%; height: 50%; }
        @keyframes bob { 50% { transform: translateY(calc(var(--u) * -.6)); } }
        .idle b { display: block; color: var(--white); font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 2); }
        .idle span { display: block; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: calc(var(--u) * 1.4); margin-top: calc(var(--u) * .3); }

        footer {
            display: flex; justify-content: space-between; align-items: center;
            color: var(--text-2); font-weight: 700; font-size: calc(var(--u) * 1.15);
            padding: 0 calc(var(--u) * .6);
        }
        footer b { color: var(--white); font-family: var(--display); font-weight: 600; }
        footer .tagline { font-family: var(--display); font-weight: 500; letter-spacing: .3em; text-transform: uppercase; }
        footer .tagline em { font-style: normal; color: var(--red-hi); }

        /* Live match */
        main.is-match .fighter { padding: calc(var(--u) * .8) calc(var(--u) * 1.1); }
        main.is-match .fighter .avatar { width: calc(var(--u) * 3.6); height: calc(var(--u) * 3.6); font-size: calc(var(--u) * 1.6); }
        main.is-match .fighter .nm { font-size: calc(var(--u) * 1.6); }
        main.is-match .fighter .sc { font-size: calc(var(--u) * 2.8); min-width: calc(var(--u) * 5); }
        main.is-match .vsb { width: calc(var(--u) * 3.8); height: calc(var(--u) * 3.8); font-size: calc(var(--u) * 1.2); }
        main.is-match .duel { margin-bottom: calc(var(--u) * 1.1); }
        main.is-match .qtext { font-size: calc(var(--u) * 1.55); line-height: 1.4; margin-bottom: calc(var(--u) * 1.1); }
        main.is-match .qtext .ar { font-size: .8em; margin-top: calc(var(--u) * .35); }
        main.is-match .tbar { margin-bottom: calc(var(--u) * 1.1); }
        main.is-match .opts { gap: calc(var(--u) * .7); }
        main.is-match .opt { padding: calc(var(--u) * .7) calc(var(--u) * 1); font-size: calc(var(--u) * 1.15); }
        main.is-match .opt .k { width: calc(var(--u) * 2.2); height: calc(var(--u) * 2.2); }

        main.is-match { grid-template-columns: 2.6fr 1fr; }
        main.is-match .left { padding: calc(var(--u) * 1.8) calc(var(--u) * 2.2); }
        .left { padding: calc(var(--u) * 2.2); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
        .side .mini { padding: calc(var(--u) * 1.8); overflow: hidden; }
        .mini .row { padding: calc(var(--u) * .7) calc(var(--u) * 1.1); }
        .mini .row .nm { font-size: calc(var(--u) * 1.25); }
        .mini .row .pts { font-size: calc(var(--u) * 1.5); min-width: calc(var(--u) * 4); }
        .mini .rows { gap: calc(var(--u) * .55); }
        .lobby-card { padding: calc(var(--u) * 2); display: flex; flex-direction: column; justify-content: center; }
        .challenge { margin-top: calc(var(--u) * 1); padding: calc(var(--u) * 1) calc(var(--u) * 1.4); border-radius: calc(var(--u) * 1); background: rgba(227,27,35,.25); border: 1px solid rgba(255,59,66,.7); font-weight: 700; font-size: calc(var(--u) * 1.2); animation: blink 1.6s ease-in-out infinite; }

        .duel { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: calc(var(--u) * 1.6); margin-bottom: calc(var(--u) * 1.6); }
        .duel.solo { grid-template-columns: 1fr; }
        .fighter { display: flex; align-items: center; gap: calc(var(--u) * 1.2); padding: calc(var(--u) * 1.2) calc(var(--u) * 1.4); border-radius: calc(var(--u) * 1.2); background: rgba(255,255,255,.05); border: 1px solid var(--hair); transition: background .3s, border-color .3s; min-width: 0; }
        .fighter.right { flex-direction: row-reverse; text-align: end; }
        .fighter.answered { background: rgba(23,168,100,.18); border-color: rgba(23,168,100,.6); }
        .fighter.lead { border-color: rgba(255,59,66,.8); box-shadow: 0 0 0 1px rgba(255,59,66,.5); }
        .fighter .who-t { flex: 1; min-width: 0; }
        .fighter .nm { font-weight: 800; font-size: calc(var(--u) * 1.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fighter .st { color: var(--text-2); font-weight: 700; font-size: calc(var(--u) * 1.1); margin-top: calc(var(--u) * .2); }
        .fighter .sc { font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 3.4); line-height: 1; min-width: calc(var(--u) * 7); text-align: center; }
        .vsb { width: calc(var(--u) * 5); height: calc(var(--u) * 5); border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 1.5); background: linear-gradient(145deg, #F2343B, #C3121A); box-shadow: 0 14px 34px -10px rgba(227,27,35,.9); }

        .qhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: calc(var(--u) * .9); font-weight: 700; font-size: calc(var(--u) * 1.25); color: var(--text-2); }
        .qhead b { color: var(--white); }
        .tnum { min-width: calc(var(--u) * 5); padding: calc(var(--u) * .4) calc(var(--u) * 1.2); border-radius: 999px; background: var(--white); color: #111; font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 1.8); text-align: center; font-variant-numeric: tabular-nums; }
        .tnum.urgent { background: var(--red); color: #fff; }
        .tbar { height: calc(var(--u) * .55); border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; margin-bottom: calc(var(--u) * 1.6); }
        .tbar span { display: block; height: 100%; width: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--red-deep), var(--red-hi)); transition: width .2s linear; }
        .qtext { font-weight: 700; font-size: calc(var(--u) * 1.75); line-height: 1.45; margin-bottom: calc(var(--u) * 1.6); }
        .qtext .ar { display: block; font-family: 'IBM Plex Sans Arabic', sans-serif; font-weight: 600; color: var(--text-2); font-size: .72em; margin-top: calc(var(--u) * .6); direction: rtl; }
        .opts { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * .9); }
        .opt { display: flex; align-items: center; gap: calc(var(--u) * 1); padding: calc(var(--u) * 1) calc(var(--u) * 1.2); border-radius: calc(var(--u) * 1); background: rgba(255,255,255,.05); border: 1px solid var(--hair); font-weight: 600; font-size: calc(var(--u) * 1.3); line-height: 1.35; transition: all .3s; }
        .opt .k { flex: none; width: calc(var(--u) * 2.6); height: calc(var(--u) * 2.6); border-radius: calc(var(--u) * .6); display: grid; place-items: center; border: 1px solid var(--hair-2); font-family: var(--display); font-weight: 600; }
        .opt .tx { flex: 1; }
        .opt.ok { background: linear-gradient(135deg, #1BB56C, #11894F); border-color: transparent; }
        .opt.dim { opacity: .35; }
        .opt .who { flex: none; padding: calc(var(--u) * .25) calc(var(--u) * .8); border-radius: 999px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.5); font-size: calc(var(--u) * .95); font-weight: 800; }
        .opt .who.bad { background: var(--red); border-color: var(--red); }
        .gain { color: #6EE7A8; font-family: var(--display); font-weight: 600; margin-inline-start: calc(var(--u) * .6); }

        .center-stage { flex: 1; display: grid; place-items: center; text-align: center; }
        .center-stage .k { color: var(--text-2); font-family: var(--display); letter-spacing: .24em; text-transform: uppercase; font-size: calc(var(--u) * 1.2); }
        .center-stage h2 { font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 4.4); letter-spacing: -.03em; margin: calc(var(--u) * .6) 0; }
        .center-stage h2 em { font-style: normal; color: var(--red-hi); }
        .bigc { width: calc(var(--u) * 13); height: calc(var(--u) * 13); margin: calc(var(--u) * 1.6) auto 0; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 7); background: linear-gradient(145deg, #F2343B, #C3121A); box-shadow: 0 30px 70px -20px rgba(227,27,35,.9); animation: beat 1s ease-in-out infinite; }
        @keyframes beat { 0% { transform: scale(1); } 15% { transform: scale(1.1); } 40% { transform: scale(1); } }
        .pz-lanes { display: grid; gap: calc(var(--u) * 1.4); width: 100%; }
        .lane { text-align: start; }
        .lane .ln { display: flex; justify-content: space-between; font-weight: 800; font-size: calc(var(--u) * 1.5); margin-bottom: calc(var(--u) * .6); }
        .lane .ln small { color: var(--text-2); font-weight: 700; }
        .lane .track { height: calc(var(--u) * 2.2); border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; }
        .lane .track span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--red-deep), var(--red-hi)); transition: width .5s var(--ease); }
        .lane.done .track span { background: linear-gradient(90deg, #11894F, #1BB56C); }
        .winner-name { font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 5.4); color: var(--red-hi); letter-spacing: -.03em; }
        .res-row { display: flex; justify-content: center; gap: calc(var(--u) * 2); margin-top: calc(var(--u) * 2); }
        .res-box { min-width: calc(var(--u) * 18); padding: calc(var(--u) * 1.6); border-radius: calc(var(--u) * 1.3); background: rgba(255,255,255,.05); border: 1px solid var(--hair); }
        .res-box.win { background: linear-gradient(180deg, rgba(227,27,35,.35), rgba(227,27,35,.08)); border-color: rgba(255,59,66,.7); }
        .res-box b { display: block; font-weight: 800; font-size: calc(var(--u) * 1.6); }
        .res-box .p { font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 4); line-height: 1.1; }
        .res-box small { color: var(--text-2); font-weight: 700; font-size: calc(var(--u) * 1); }
    </style>
</head>
